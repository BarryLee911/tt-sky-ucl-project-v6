name: gds
on:
  push:
    branches: [experiment/80mhz-official-4x2-density70]
    paths: ['src/**', 'test/**', 'scripts/**', 'info.yaml', 'experiment.json', 'build_lock.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build GDS
        id: harden
        uses: TinyTapeout/tt-gds-action@395eedb3eeec3c2f4961c3b04ff2cf87f5525636 # ttsky26d
        with:
          pdk: sky130A
          tools-ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
          librelane-version: '3.0.14'
  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@395eedb3eeec3c2f4961c3b04ff2cf87f5525636
        with:
          tools-ref: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@395eedb3eeec3c2f4961c3b04ff2cf87f5525636
