name: test
on:
  push:
    branches: [experiment/80mhz-official-4x2-density80]
    paths: ['src/**', 'test/**', 'scripts/**', 'info.yaml', 'experiment.json', 'build_lock.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install simulator and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install -r test/requirements.txt
      - name: Verify immutable source and frequency
        run: python scripts/verify_inputs.py
      - name: Pin-level RTL regression
        run: |
          cd test
          make
          python -m cocotb_tools.check_results results.xml
      - name: Preserve RTL results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            verification/inputs.json
            test/results.xml
            test/tb.fst
            test/output/*

